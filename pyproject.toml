[project]
name = "injlab"
version = "0.1.0"
description = "Injection Defense Lab - agentic discovery of gaps in stacked prompt-injection defenses (Hack-Nation 7, Challenge 03)"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "matplotlib>=3.8"]

[project.optional-dependencies]
detector = ["transformers>=4.44", "torch>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["injlab"]
